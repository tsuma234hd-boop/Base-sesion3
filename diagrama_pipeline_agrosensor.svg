<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 260" width="1040" height="260" role="img" aria-label="Pipeline de AgroSensor Sinú: sensores, validación, conversión de unidades, agregación por hora, detección de riesgo y SMS en menos de 2 minutos">
  <title>Pipeline de AgroSensor Sinú</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#151515"/>
    </marker>
  </defs>

  <text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#151515">AgroSensor Sinú · estilo Pipeline</text>
  <text x="20" y="48" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#353535">Cada filtro recibe datos, los transforma y los entrega al siguiente. Ninguno conoce a los demás.</text>

  <rect x="20" y="90" width="130" height="70" fill="#F3F3F0" stroke="#151515" stroke-width="1.5"/>
  <text x="85" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#151515">Sensores</text>
  <text x="85" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#353535">600 · cada minuto</text>

  <rect x="185" y="90" width="130" height="70" fill="#FFFFFF" stroke="#151515" stroke-width="1.5"/>
  <text x="250" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#151515">Validar</text>
  <text x="250" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#353535">lecturas</text>

  <rect x="350" y="90" width="130" height="70" fill="#FFFFFF" stroke="#151515" stroke-width="1.5"/>
  <text x="415" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#151515">Convertir</text>
  <text x="415" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#353535">unidades</text>

  <rect x="515" y="90" width="130" height="70" fill="#FFFFFF" stroke="#151515" stroke-width="1.5"/>
  <text x="580" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#151515">Agregar</text>
  <text x="580" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#353535">por hora</text>

  <rect x="680" y="90" width="130" height="70" fill="#FFFFFF" stroke="#151515" stroke-width="1.5"/>
  <text x="745" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#151515">Detectar</text>
  <text x="745" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#353535">riesgo</text>

  <rect x="845" y="90" width="175" height="70" fill="#F3F3F0" stroke="#151515" stroke-width="1.5"/>
  <text x="932" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#151515">SMS de alerta</text>
  <text x="932" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#353535">en menos de 2 minutos</text>

  <line x1="150" y1="125" x2="180" y2="125" stroke="#151515" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="315" y1="125" x2="345" y2="125" stroke="#151515" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="480" y1="125" x2="510" y2="125" stroke="#151515" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="645" y1="125" x2="675" y2="125" stroke="#151515" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="810" y1="125" x2="840" y2="125" stroke="#151515" stroke-width="1.5" marker-end="url(#flecha)"/>

  <path d="M85,160 L85,205 L932,205 L932,165" fill="none" stroke="#6F6F6F" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#flecha)"/>
  <text x="430" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6F6F6F">tubería / cola de mensajes · formato intermedio común · monitoreo y reintentos</text>

  <text x="20" y="248" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#353535">Cada filtro se prueba por separado y se puede reemplazar sin tocar los demás.</text>
</svg>
